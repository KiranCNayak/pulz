# Local dev environment only — not a production deployment manifest
# (ARCHITECTURE.md §4/§9 describes the real hosting split). Spins up
# Postgres, the backend (Fastify + Socket.IO, tsx watch), and the frontend
# (Vite dev server) each as their own service so the whole stack can be
# brought up with one command for manual/E2E testing.
#
# Usage: docker compose up --build
# Frontend: http://localhost:5173
# Backend:  http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulz
    ports:
      - "5432:5432"
    volumes:
      - pulz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pulz?schema=public
      PORT: "3000"
      HOST: "0.0.0.0"
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
      AUTH_SECRET: dev-secret-change-me
      RESULTS_TTL_HOURS: "24"
      RESULTS_CLEANUP_INTERVAL_MINUTES: "5"
      # Dev-only: production keeps the 10/hour default (Decision #38). Each
      # full E2E run registers 3 Creators, so the default would trip after
      # ~3 runs an hour — raised here so the suite can be run repeatedly.
      REGISTER_RATE_LIMIT_PER_HOUR: "1000"
      # Empty = telemetry off. `make observe` points it at the lgtm service
      # below (docs/OBSERVABILITY.md).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_SOCKET_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Opt-in local stand-in for Grafana Cloud (docs/OBSERVABILITY.md):
  # Grafana + Prometheus + Loki + Tempo behind one OTLP endpoint, with the
  # Pulz dashboard pre-loaded. Only started by `make observe` (the
  # "observability" profile), never by a plain `make up`.
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: ["observability"]
    ports:
      - "3001:3000" # Grafana UI (3000 is the backend)
      - "4318:4318" # OTLP/HTTP, for a native `make dev` backend
    volumes:
      - ./observability/grafana/provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pulz.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/pulz-dashboards:ro

volumes:
  pulz_postgres_data:
